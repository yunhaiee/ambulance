# Host (구급AI에이전트) - orchestrates the emergency dispatch via A2A.
# Dependencies are intentionally minimal: only what the code imports.

[project]
name = "EmergencyAIAgent"
version = "0.2.0"
description = "A multi-agent system for ambulance emergency dispatch (host agent)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk[a2a,db]>=2.3.0",
    # google-adk 2.3.0 pins a2a-sdk <0.4; track ADK's supported range.
    "a2a-sdk[http-server]>=0.3.4,<0.4",
    "httpx>=0.28",
    "nest-asyncio>=1.6.0",
    "python-dotenv>=1.1",
    "pydantic>=2.11",
    "uvicorn>=0.35",
]
